name: setup
description: Install mise, the pinned tools, and dependencies.

runs:
  using: composite
  steps:
    # Unpinned: mise here must never be older than the mise that wrote
    # mise.lock. https://mise.jdx.dev/continuous-integration.html
    - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
      with:
        install: true
        cache: true
      env:
        GITHUB_TOKEN: ${{ github.token }}
